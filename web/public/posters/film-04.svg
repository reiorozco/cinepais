<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <title>Códigos Rotos</title>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1F23"/>
      <stop offset="0.55" stop-color="#121417"/>
      <stop offset="1" stop-color="#0A0B0D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC53D" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFC53D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" seed="373" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="600" height="900" fill="url(#field)"/>
  <circle cx="300" cy="316" r="270" fill="url(#glow)"/>
  <g transform="rotate(1 300 316)"><circle cx="300" cy="316" r="58" fill="#FFC53D" opacity="0.16"/><ellipse cx="300" cy="316" rx="176" ry="54" fill="none" stroke="#FFC53D" stroke-width="2.5" opacity="0.62"/><ellipse cx="300" cy="316" rx="176" ry="54" fill="none" stroke="#FFC53D" stroke-width="1.5" opacity="0.32" transform="rotate(58 300 316)"/></g>
  <rect width="600" height="900" fill="url(#vignette)"/>
  <rect width="600" height="900" filter="url(#grain)" opacity="0.14"/>
  <rect x="64" y="562.3" width="56" height="4" fill="#FFC53D"/>
  <text x="64" y="680" textLength="465.22" lengthAdjust="spacingAndGlyphs" fill="#F3F5F7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="100" font-weight="700">CÓDIGOS</text>
  <text x="64" y="782" textLength="350.27" lengthAdjust="spacingAndGlyphs" fill="#F3F5F7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="100" font-weight="700">ROTOS</text>
  <text x="64" y="838" textLength="210.68" lengthAdjust="spacingAndGlyphs" fill="#9AA2AB" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400">ACCIÓN · 135 MIN</text>

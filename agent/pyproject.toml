[project]
name = "cinepais-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "reiorozco", email = "rfoc15@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cachetools>=7.1.7",
    "fastapi>=0.141.1",
    "google-genai>=2.17.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.2",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.10",
    "mcp>=1.29.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "slowapi>=0.1.10",
    "sse-starlette>=3.4.8",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.9.20,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "evals: marks tests as evaluation tests requiring live LLM + web server",
    "integration: marks tests as integration tests requiring live web server",
]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
